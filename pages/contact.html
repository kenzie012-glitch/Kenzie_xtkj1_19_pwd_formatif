<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak - Kenzie</title>

    <!-- CSS Internal -->
    <style>
        /* CSS Gradient Pattern untuk Latar Belakang Kotak-Kotak Biru-Putih */
        body {
            background-color: #e0f2fe; /* Warna dasar biru muda soft */
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 40px,
                    rgba(59, 130, 246, 0.15) 40px,
                    rgba(59, 130, 246, 0.15) 80px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 40px,
                    rgba(59, 130, 246, 0.15) 40px,
                    rgba(59, 130, 246, 0.15) 80px
                );
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        #contact {
            padding: 40px 20px;
        }

        /* Kartu Formulir Kontak */
        .contact-form {
            width: 400px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #bfdbfe;
            background-color: #ffffff; /* Latar kartu tetap putih padat agar teks jelas */
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.1);
        }

        .contact-form h2 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .form-group input, 
        .form-group textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        /* Focus state saat kotak input diklik */
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%; /* Dibuat penuh agar tampil makin keren */
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            padding-bottom: 30px;
        }

        footer a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
