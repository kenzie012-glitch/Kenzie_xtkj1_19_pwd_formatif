<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol - Soal 1.2</title>

    <!-- CSS Internal -->
    <style>
        /* Tag Selector */
        body {
            background-color: aliceblue; /* Nama warna (Color Name) */
            font-family: Arial, sans-serif; /* Font Arial dengan fallback sans-serif */
            margin: 20px;
            padding: 20px;
        }

        /* Tag Selector */
        h2 {
            color: #1a2530; /* Hex format */
            font-size: 20px;
            margin-bottom: 15px;
        }

        /* Class Selector (Dipakai oleh semua tombol) */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        /* Descendant Selector (Margin antar tombol di dalam group) */
        .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        /* Class Selectors (Warna masing-masing tombol) */
        .btn-primary {
            background-color: #1d3557; /* Hex */
            color: #ffffff;
        }

        .btn-secondary {
            background-color: rgb(200, 214, 229); /* RGB format */
        }

        .btn-outline {
            background-color: #ffffff;
            border: 2px solid #1d3557;
        }

        .btn-send {
            background-color: rgba(230, 126, 34, 0.9); /* RGBA format */
            color: #ffffff;
        }

        /* Grouping Selector (Dua tombol berbagi warna teks gelap) */
        .btn-secondary, .btn-outline {
            color: #2c3e50;
        }

        /* Pseudo-class Selector (:hover) */
        .btn-primary:hover {
            background-color: #457b9d;
        }

        .btn-secondary:hover {
            background-color: rgb(170, 185, 200);
        }

        .btn-outline:hover {
            background-color: #1d3557;
            color: #ffffff;
        }

        .btn-send:hover {
            background-color: rgba(211, 84, 0, 1);
        }

        /* Footer link */
        footer {
            margin-top: 30px;
        }

        footer a {
            color: #2980b9;
        }
    </style>
</head>
<body>

    <main>
        <h2>Kumpulan Tombol</h2>

        <!-- Wrapper Button Group -->
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
