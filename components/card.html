<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek - Soal 2.1</title>

    <!-- 
      Hitungan Lebar Kartu Tanpa box-sizing: border-box:
      Lebar dasar (width) = 320px
      Padding kiri-kanan (20px + 20px) = 40px
      Border kiri-kanan (2px + 2px) = 4px
      Total Lebar Fisik = 320px + 40px + 4px = 364px
    -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #e0f2fe;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(59, 130, 246, 0.12) 40px, rgba(59, 130, 246, 0.12) 80px),
                repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(59, 130, 246, 0.12) 40px, rgba(59, 130, 246, 0.12) 80px);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .card {
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #bfdbfe;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.1);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        .card h3 {
            color: #1e3a8a;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card p {
            font-size: 15px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card a {
            font-size: 15px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        .card a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 30px;
        }

        footer a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="../assets/images/kotak.jpg" alt="Foto Proyek Toko Online Kenzie">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
