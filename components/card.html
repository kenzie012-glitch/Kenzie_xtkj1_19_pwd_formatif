<!-- Tanpa box-sizing: Lebar total = 320px + 20px (padding kiri) + 20px (padding kanan) + 2px (border kiri) + 2px (border kanan) = 364px -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kartu Proyek</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 320px;
      padding: 20px;
      border: 2px solid #1e293b;
      margin: 30px auto;
      background-color: #ffffff;
    }
    .card img {
      width: 100%;
      height: 160px;
      display: block;
      object-fit: cover;
    }
    .card h3 {
      color: #0f172a;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 15px;
      color: #334155;
    }
    .card a {
      font-size: 15px;
      color: #d97706;
      text-decoration: none;
      font-weight: bold;
    }
    footer {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="../assets/images/kotak.jpg" alt="Foto Proyek">
      <h3>Website Toko Online</h3>
      <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
      <a href="#">Lihat Proyek</a>
    </div>
  </main>
  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>
</body>
</html>
